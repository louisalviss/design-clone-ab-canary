name: A/B visual comparison

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout B
        uses: actions/checkout@v4
        with:
          path: clone
      - name: Checkout extractor
        uses: actions/checkout@v4
        with:
          repository: louisalviss/design-md-chrome
          ref: main
          path: extractor
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extractor/package-lock.json
      - name: Install Chromium
        working-directory: extractor
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Install Iris 0.4.1
        run: |
          curl -fsSL -o /tmp/iris.tgz https://github.com/brijr/iris/releases/download/v0.4.1/iris-x86_64-unknown-linux-musl.tar.gz
          tar -xzf /tmp/iris.tgz -C /tmp
          IRIS_BIN=$(find /tmp -maxdepth 3 -type f -name iris -perm -111 | head -1)
          sudo install -m 0755 "$IRIS_BIN" /usr/local/bin/iris
          iris --version
          CHROME=$(find "$HOME/.cache/ms-playwright" -type f -name chrome -perm -111 | head -1)
          test -n "$CHROME"
          cat > /tmp/chrome-iris <<EOF
          #!/bin/sh
          exec "$CHROME" --no-sandbox "\$@"
          EOF
          chmod 0755 /tmp/chrome-iris
          echo "PLAYWRIGHT_CHROME=$CHROME" >> "$GITHUB_ENV"
          echo "IRIS_CHROME=/tmp/chrome-iris" >> "$GITHUB_ENV"
          "$CHROME" --version
      - name: Serve B
        run: |
          python3 -m http.server 4173 --directory clone >/tmp/b-http.log 2>&1 &
          echo $! >/tmp/b-http.pid
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 0.5; done
          exit 1
      - name: Control capture A and B with existing extractor
        run: |
          cd extractor
          /usr/bin/time -f "%e" -o /tmp/control-A.seconds npm run extract:url -- --url https://launchpage.xyz/example.html --out /tmp/A --preset android-pixel6 --timeout-ms 120000
          /usr/bin/time -f "%e" -o /tmp/control-B.seconds npm run extract:url -- --url http://127.0.0.1:4173/ --out /tmp/B --preset android-pixel6 --timeout-ms 120000
      - name: Treatment capture A and B with Iris
        run: |
          set -o pipefail
          /usr/bin/time -f "%e" -o /tmp/iris-A.seconds iris --chrome "$IRIS_CHROME" --size 412x915 --scale 1 --json -o /tmp/iris-A.png https://launchpage.xyz/example.html | tee /tmp/iris-A.jsonl
          /usr/bin/time -f "%e" -o /tmp/iris-B.seconds iris --chrome "$IRIS_CHROME" --size 412x915 --scale 1 --json -o /tmp/iris-B.png http://127.0.0.1:4173/ | tee /tmp/iris-B.jsonl
          test -s /tmp/iris-A.png
          test -s /tmp/iris-B.png
      - name: Score control and treatment
        run: |
          python3 clone/tools/visual_diff.py /tmp/A/source.png /tmp/B/source.png --out /tmp/control-ab.json --diff /tmp/control-ab-diff.png --max-score 1.0
          python3 clone/tools/visual_diff.py /tmp/iris-A.png /tmp/iris-B.png --out /tmp/iris-ab.json --diff /tmp/iris-ab-diff.png --max-score 1.0
          python3 clone/tools/visual_diff.py /tmp/A/source.png /tmp/iris-A.png --out /tmp/A-engine-parity.json --diff /tmp/A-engine-parity.png --max-score 1.0
          python3 clone/tools/visual_diff.py /tmp/B/source.png /tmp/iris-B.png --out /tmp/B-engine-parity.json --diff /tmp/B-engine-parity.png --max-score 1.0
      - name: Build A/B summary
        run: |
          python3 - <<"PY"
          import json
          from pathlib import Path
          def j(p): return json.loads(Path(p).read_text())
          def f(p): return float(Path(p).read_text().strip())
          c=j("/tmp/control-ab.json"); i=j("/tmp/iris-ab.json"); ap=j("/tmp/A-engine-parity.json"); bp=j("/tmp/B-engine-parity.json")
          out={
            "schema":"iris-ab-integration-v1",
            "iris_version":"0.4.1",
            "viewport":"412x915@1x",
            "control_ab_score":c["score"],
            "control_ab_similarity":c["similarity"],
            "iris_ab_score":i["score"],
            "iris_ab_similarity":i["similarity"],
            "ab_score_delta":round(i["score"]-c["score"],6),
            "engine_parity_A_score":ap["score"],
            "engine_parity_B_score":bp["score"],
            "integrated_seconds":{"control_A":f("/tmp/control-A.seconds"),"control_B":f("/tmp/control-B.seconds"),"iris_A":f("/tmp/iris-A.seconds"),"iris_B":f("/tmp/iris-B.seconds")}
          }
          Path("/tmp/iris-ab-summary.json").write_text(json.dumps(out,indent=2)+"\n")
          print(json.dumps(out,indent=2))
          PY
      - name: Collect proof
        run: |
          mkdir -p /tmp/ab-proof
          cp /tmp/A/source.png /tmp/ab-proof/A-target-control.png
          cp /tmp/B/source.png /tmp/ab-proof/B-clone-control.png
          cp /tmp/iris-A.png /tmp/ab-proof/A-target-iris.png
          cp /tmp/iris-B.png /tmp/ab-proof/B-clone-iris.png
          cp /tmp/control-ab-diff.png /tmp/ab-proof/control-ab-diff.png
          cp /tmp/iris-ab-diff.png /tmp/ab-proof/iris-ab-diff.png
          cp /tmp/A-engine-parity.png /tmp/ab-proof/A-engine-parity.png
          cp /tmp/B-engine-parity.png /tmp/ab-proof/B-engine-parity.png
          cp /tmp/control-ab.json /tmp/ab-proof/control-ab.json
          cp /tmp/iris-ab.json /tmp/ab-proof/iris-ab.json
          cp /tmp/A-engine-parity.json /tmp/ab-proof/A-engine-parity.json
          cp /tmp/B-engine-parity.json /tmp/ab-proof/B-engine-parity.json
          cp /tmp/iris-ab-summary.json /tmp/ab-proof/iris-ab-summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ab-visual-proof
          path: /tmp/ab-proof
          if-no-files-found: error
          retention-days: 7
      - name: Enforce visual QA gate
        run: |
          python3 - <<"PY"
          import json, sys
          from pathlib import Path
          def score(path): return json.loads(Path(path).read_text())["score"]
          values = {
            "clone_control": score("/tmp/control-ab.json"),
            "clone_iris": score("/tmp/iris-ab.json"),
            "target_engine_parity": score("/tmp/A-engine-parity.json"),
            "clone_engine_parity": score("/tmp/B-engine-parity.json"),
          }
          limits = {
            "clone_control": 0.05,
            "clone_iris": 0.05,
            "target_engine_parity": 0.03,
            "clone_engine_parity": 0.03,
          }
          failures = [f"{k}={values[k]:.6f}>{limits[k]:.6f}" for k in values if values[k] > limits[k]]
          drift = abs(values["clone_control"] - values["clone_iris"])
          if drift > 0.01:
            failures.append(f"engine_score_drift={drift:.6f}>0.010000")
          gate = {"schema":"iris-visual-gate-v1","values":values,"limits":limits,"engine_score_drift":drift,"pass":not failures,"failures":failures}
          Path("/tmp/visual-gate.json").write_text(json.dumps(gate, indent=2)+"\n")
          print(json.dumps(gate, indent=2))
          if failures:
            sys.exit(1)
          PY
