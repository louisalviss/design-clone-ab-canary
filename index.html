<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Launching Soon — Evidence Clone</title>
  <meta name="description" content="A/B canary clone generated from extracted design evidence only." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #1a2f42;
      --blue: #2c5f7c;
      --muted: rgba(26,47,66,.70);
      --surface: #fff;
      --bg-top: #f8fafc;
      --bg-bottom: #e9eef4;
      --radius: 12px;
      --shadow: 0 4px 6px -1px rgba(0,0,0,.10),0 2px 4px -1px rgba(0,0,0,.06);
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body {
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "DM Sans", sans-serif;
      color: var(--ink);
      background: linear-gradient(180deg,var(--bg-top) 0%,var(--bg-bottom) 100%);
      padding: 16px;
    }
    .back-link {
      position: fixed;
      top: 16px;
      left: 16px;
      width: 221px;
      height: 34px;
      padding: 8px 16px;
      border-radius: 12px;
      background: #fff;
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      z-index: 10;
    }
    .back-link a {
      color: var(--blue);
      font-size: 14px;
      line-height: 18px;
      font-weight: 700;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }
    .arrow { font-size: 14px; font-weight: 500; transform: translateY(-1px); }
    .theme-toggle {
      position: fixed;
      top: 16px;
      right: 16px;
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 9999px;
      background: #fff;
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink);
      padding: 0;
    }
    .theme-toggle svg { width: 22px; height: 22px; }
    .container {
      width: min(380px, calc(100vw - 32px));
      max-width: 540px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
      text-align: center;
    }
    .rocket-container {
      width: 200px;
      height: 200px;
      flex: 0 0 200px;
      animation: float 4s ease-in-out infinite;
    }
    .rocket-container svg { width: 200px; height: 200px; display: block; }
    h1 {
      width: 283px;
      max-width: 100%;
      margin: 0;
      color: var(--ink);
      font-size: 32px;
      line-height: 38.4px;
      font-weight: 700;
    }
    .subtitle {
      width: 100%;
      max-width: 460px;
      margin: 0;
      color: var(--muted);
      font-size: 15.2px;
      line-height: 24.32px;
      font-weight: 400;
    }
    form {
      width: 100%;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .form-row {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .form-input,
    .submit-btn {
      width: 100%;
      height: 45px;
      border-radius: var(--radius);
      font: inherit;
    }
    .form-input {
      border: 0;
      background: var(--surface);
      color: var(--ink);
      padding: 12px 16px;
      font-size: 16px;
      font-weight: 400;
      box-shadow: var(--shadow);
      outline: none;
    }
    .form-input::placeholder { color: rgba(26,47,66,.50); opacity: 1; }
    .submit-btn {
      border: 0;
      background: var(--blue);
      color: #fff;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: 600;
      box-shadow: var(--shadow);
    }
    .footer {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 67.19px;
      padding: 24px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      line-height: 19.2px;
      font-weight: 400;
    }
    .footer a { color: var(--blue); text-decoration: none; font-weight: 500; }
    @keyframes float {
      0%,100% { transform: translateY(-5.5px); }
      50% { transform: translateY(5.5px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .rocket-container { animation: none; transform: translateY(-5.5px); }
    }
    @media (max-width: 480px) {
      .container { width: calc(100vw - 32px); }
    }
  </style>
</head>
<body>
  <div class="back-link"><a href="https://launchpage.xyz/" rel="noreferrer"><span class="arrow">←</span><span>Back to Launchpage.xyz</span></a></div>
  <button class="theme-toggle" type="button" aria-label="Theme preview">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
      <circle cx="12" cy="12" r="3.2"/><path d="M12 2.2v2M12 19.8v2M2.2 12h2M19.8 12h2M5.1 5.1l1.4 1.4M17.5 17.5l1.4 1.4M18.9 5.1l-1.4 1.4M6.5 17.5l-1.4 1.4"/>
    </svg>
  </button>

  <main class="container">
    <div class="rocket-container" aria-hidden="true">
      <svg viewBox="0 0 200 200" role="img">
        <defs>
          <clipPath id="inner"><circle cx="100" cy="100" r="72"/></clipPath>
        </defs>
        <circle cx="100" cy="100" r="99" fill="#fff"/>
        <circle cx="100" cy="100" r="82" fill="#dcecf1"/>
        <circle cx="100" cy="100" r="72" fill="#1a2f42"/>
        <g clip-path="url(#inner)">
          <path d="M18 102 57 70 81 94 110 61 144 97 176 76 190 116v61H8z" fill="#264962"/>
          <path d="M18 121 61 86 89 113 117 78 151 111 182 94 190 162H10z" fill="#2c5f7c" opacity=".72"/>
          <g fill="#fff">
            <circle cx="26" cy="151" r="31"/><circle cx="52" cy="158" r="30"/><circle cx="79" cy="154" r="33"/><circle cx="109" cy="160" r="31"/><circle cx="139" cy="153" r="32"/><circle cx="169" cy="158" r="35"/>
          </g>
          <g stroke="#fff" stroke-width="5" stroke-linecap="round">
            <path d="M92 127 78 161"/><path d="M100 128 100 167"/><path d="M108 127 122 161"/>
          </g>
        </g>
        <g transform="translate(0 -4)">
          <path d="M100 29c-12 13-19 33-19 57v27h38V86c0-24-7-44-19-57z" fill="#f6f7f8" stroke="#d9dde2" stroke-width="2"/>
          <path d="M100 29c-6 7-10 14-13 22h26c-3-8-7-15-13-22z" fill="#c9343b"/>
          <path d="M81 83 66 93l1 23 14-8zM119 83l15 10-1 23-14-8z" fill="#d84048"/>
          <path d="M81 92h38v12H81z" fill="#b9343b"/>
          <circle cx="100" cy="69" r="12" fill="#fff" stroke="#cad6dc" stroke-width="2"/>
          <circle cx="100" cy="69" r="8" fill="#4a9bae"/>
          <path d="M95 75 106 62" stroke="#c6edf3" stroke-width="2"/>
          <path d="M91 114h18l-3 18H94z" fill="#d8dde1"/>
        </g>
      </svg>
    </div>

    <h1>Launching Soon</h1>
    <p class="subtitle">This page is getting ready for launch. Drop your email<br />and we'll notify you the moment it's ready.</p>
    <form onsubmit="event.preventDefault()">
      <div class="form-row">
        <input class="form-input" type="text" placeholder="First name" aria-label="First name" />
        <input class="form-input" type="email" placeholder="Email address" aria-label="Email address" />
      </div>
      <button class="submit-btn" type="submit">Notify Me</button>
    </form>
  </main>

  <footer class="footer"><a href="https://launchpage.xyz/">launchpage.xyz</a> is proudly powered by <a href="#">The Codeero Group</a></footer>
</body>
</html>
